<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="bgGcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="55%" stop-color="#165c3d"/>
      <stop offset="100%" stop-color="#1f7a4c"/>
    </linearGradient>
    <radialGradient id="glowGcc" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38a169" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38a169" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGcc" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="url(#bgGcc)"/>
  <rect width="1600" height="480" fill="url(#glowGcc)"/>
  <circle cx="1420" cy="60" r="180" fill="#38a169" opacity="0.22" filter="url(#blurGcc)"/>
  <circle cx="160" cy="430" r="170" fill="#86efac" opacity="0.14" filter="url(#blurGcc)"/>

  <rect x="100" y="60" width="1400" height="360" rx="26" fill="#07231a" opacity="0.55"/>

  <circle cx="800" cy="130" r="34" fill="#2e8b57" opacity="0.95"/>
  <path d="M786,132 L797,144 L818,116" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="210" fill="#bbf7d0" font-size="20" font-weight="800" letter-spacing="0.5">الاعتماد الأخضر GCC</text>
    <text x="800" y="256" fill="#ffffff" font-size="22" font-weight="800">
      <tspan x="800" dy="0">اشترك مع مبادرة جرين سايكل للخدمات والاعتماد</tspan>
      <tspan x="800" dy="26">لتحقيق الفعالية البيئية الخضراء لمباني المؤسسات</tspan>
      <tspan x="800" dy="26">مع تحقيق الجدوى المالية والفنية المثالية.</tspan>
      <tspan x="800" dy="26">الاعتماد يواكب التطور الكبير في حسابات البصمة</tspan>
      <tspan x="800" dy="26">الكربونية وكيفية الاستفادة من النهضة الحديثة</tspan>
      <tspan x="800" dy="26">في مفاهيم أسواق الكربون</tspan>
    </text>
  </g>
</svg>
