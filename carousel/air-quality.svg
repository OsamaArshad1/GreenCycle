<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="bgAir" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="55%" stop-color="#165c3d"/>
      <stop offset="100%" stop-color="#1f7a4c"/>
    </linearGradient>
    <radialGradient id="glowAir" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38a169" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38a169" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurAir" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="url(#bgAir)"/>
  <rect width="1600" height="480" fill="url(#glowAir)"/>
  <circle cx="180" cy="70" r="180" fill="#38a169" opacity="0.22" filter="url(#blurAir)"/>
  <circle cx="1420" cy="420" r="170" fill="#86efac" opacity="0.14" filter="url(#blurAir)"/>

  <rect x="100" y="60" width="1400" height="360" rx="26" fill="#07231a" opacity="0.55"/>

  <circle cx="800" cy="130" r="34" fill="#2e8b57" opacity="0.95"/>
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M780,120 C787,113 794,127 801,120 C808,113 815,127 822,120"/>
    <path d="M780,132 C787,125 794,139 801,132 C808,125 815,139 822,132"/>
    <path d="M780,144 C787,137 794,151 801,144 C808,137 815,151 822,144"/>
  </g>

  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="210" fill="#bbf7d0" font-size="20" font-weight="800" letter-spacing="0.5">جودة الهواء</text>
    <text x="800" y="264" fill="#ffffff" font-size="26" font-weight="800">
      <tspan x="800" dy="0">تواصلوا معنا للتعرف على خطوات تقييم جودة الهواء</tspan>
      <tspan x="800" dy="40">في المبنى وكيفية تحسينها وتحقيق جودة الهواء المثلى</tspan>
    </text>
  </g>
</svg>
