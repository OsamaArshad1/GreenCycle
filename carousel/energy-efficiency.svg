<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="bgEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="55%" stop-color="#165c3d"/>
      <stop offset="100%" stop-color="#1f7a4c"/>
    </linearGradient>
    <radialGradient id="glowEn" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38a169" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38a169" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurEn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="url(#bgEn)"/>
  <rect width="1600" height="480" fill="url(#glowEn)"/>
  <circle cx="170" cy="70" r="180" fill="#38a169" opacity="0.22" filter="url(#blurEn)"/>
  <circle cx="1430" cy="420" r="170" fill="#86efac" opacity="0.14" filter="url(#blurEn)"/>

  <rect x="100" y="60" width="1400" height="360" rx="26" fill="#07231a" opacity="0.55"/>

  <circle cx="800" cy="130" r="34" fill="#2e8b57" opacity="0.95"/>
  <path d="M807,108 L787,132 L797,132 L791,152 L813,126 L801,126 Z" fill="#ffffff"/>

  <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="210" fill="#bbf7d0" font-size="20" font-weight="800" letter-spacing="0.5">كفاءة الطاقة</text>
    <text x="800" y="264" fill="#ffffff" font-size="27" font-weight="800">
      <tspan x="800" dy="0">تواصل معنا للتعرف على خطوات تقييم الطاقة في المبنى</tspan>
      <tspan x="800" dy="42">وكيفية تحسينها وتحقيق كفاءة الطاقة المثلى</tspan>
    </text>
  </g>
</svg>
